packages:
  - 'packages/*'
  - 'examples/*'
allowBuilds:
  esbuild: true

overrides:
  # Security patches for transitive dev tooling. vitest 3.2.7 accepts vite 7
  # (`^5 || ^6 || ^7.0.0-0`), and vite 7 brings an esbuild past the advisory,
  # so both are pinned forward rather than left on vitest's defaults.
  vite: "^7.1.12" # GHSA vite <= 6.4.2
  esbuild: "^0.25.0" # esbuild <= 0.24.2

