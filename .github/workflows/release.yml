name: Release

# release-please creates the GitHub release and pushes its tag; this workflow
# publishes both packages to npm from that tag. Re-run it by hand for an
# existing tag if a previous run failed — versions already on npm are
# skipped, so a partially published release converges.

on:
  workflow_call:
    inputs:
      tag_name:
        description: Release tag name (e.g., v0.2.0)
        type: string
        required: true
    secrets:
      PUBLIC_SOCKET_FIREWALL_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag name (e.g., v0.2.0)
        type: string
        required: true

concurrency:
  group: release-${{ inputs.tag_name }}

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag_name }}
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Setup Socket Firewall
        uses: workos/setup-socket-firewall@ca93dd8aa351f54f4729fe3377a9be23c631c25d
        with:
          token: ${{ secrets.PUBLIC_SOCKET_FIREWALL_TOKEN }}

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      # The firewall is a download control, not a publish target: restore the
      # public registry before anything below talks to npmjs.org.
      - name: Teardown Socket Firewall
        uses: workos/setup-socket-firewall/teardown@ca93dd8aa351f54f4729fe3377a9be23c631c25d

      - name: Determine npm tag
        id: npm-tag
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          VERSION="${TAG_NAME#v}"
          if [[ "$VERSION" == *"-"* ]]; then
            echo "tag=beta" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      # `pnpm pack` rewrites `workspace:*` to the released version, which a
      # plain `npm publish` of the directory would not, and `npm publish` of
      # the tarball handles trusted publishing (OIDC provenance). Core goes
      # first so @workos/sync-postgres's dependency resolves as soon as it appears.
      - name: Publish
        env:
          TAG_NAME: ${{ inputs.tag_name }}
          NPM_TAG: ${{ steps.npm-tag.outputs.tag }}
        run: |
          VERSION="${TAG_NAME#v}"
          for dir in packages/sync-engine packages/sync-postgres; do
            PACKAGE_NAME="$(node -p "require('./$dir/package.json').name")"
            PACKAGE_VERSION="$(node -p "require('./$dir/package.json').version")"
            test "$PACKAGE_VERSION" = "$VERSION"

            if npm view "$PACKAGE_NAME@$VERSION" version >/dev/null 2>&1; then
              echo "$PACKAGE_NAME@$VERSION already published; skipping"
              continue
            fi

            TARBALL="$(pnpm --filter "./$dir" pack --json --pack-destination "$RUNNER_TEMP" \
              | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).filename")"
            npm publish "$TARBALL" --tag "$NPM_TAG" --access public --provenance
          done
