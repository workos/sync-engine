name: Release

# Publishes one package to npm from its component tag (sync-engine-v1.2.3,
# sync-postgres-v0.4.0). release-please calls this once per package it
# released; re-run it by hand for an existing tag if a run failed — a
# version already on npm is skipped, so a retry converges.

on:
  workflow_call:
    inputs:
      tag_name:
        description: Component release tag (e.g., sync-postgres-v0.2.0)
        type: string
        required: true
    secrets:
      PUBLIC_SOCKET_FIREWALL_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      tag_name:
        description: Component release tag (e.g., sync-postgres-v0.2.0)
        type: string
        required: true

concurrency:
  group: release-${{ inputs.tag_name }}

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag_name }}
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # The tag is `<component>-v<version>`; the component is the directory
      # under packages/. The package.json must agree with the tag, otherwise
      # release-please and the checkout are out of step.
      - name: Resolve the package from the tag
        id: pkg
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          COMPONENT="${TAG_NAME%-v*}"
          VERSION="${TAG_NAME##*-v}"
          DIR="packages/$COMPONENT"
          if [ ! -f "$DIR/package.json" ]; then
            echo "::error::tag $TAG_NAME names no package: $DIR/package.json does not exist"
            exit 1
          fi
          NAME="$(node -p "require('./$DIR/package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./$DIR/package.json').version")"
          if [ "$PACKAGE_VERSION" != "$VERSION" ]; then
            echo "::error::$NAME is $PACKAGE_VERSION in package.json but the tag says $VERSION"
            exit 1
          fi
          case "$VERSION" in
            *-*) NPM_TAG=beta ;;
            *)   NPM_TAG=latest ;;
          esac
          {
            echo "dir=$DIR"
            echo "name=$NAME"
            echo "version=$VERSION"
            echo "npm_tag=$NPM_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Socket Firewall
        uses: workos/setup-socket-firewall@ca93dd8aa351f54f4729fe3377a9be23c631c25d
        with:
          token: ${{ secrets.PUBLIC_SOCKET_FIREWALL_TOKEN }}

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      # The firewall is a download control, not a publish target: restore the
      # public registry before anything below talks to npmjs.org.
      - name: Teardown Socket Firewall
        uses: workos/setup-socket-firewall/teardown@ca93dd8aa351f54f4729fe3377a9be23c631c25d

      # `pnpm pack` rewrites `workspace:*` to the dependency's version in this
      # checkout, which a plain `npm publish` of the directory would not, and
      # `npm publish` of the tarball handles trusted publishing (OIDC
      # provenance).
      - name: Publish
        env:
          DIR: ${{ steps.pkg.outputs.dir }}
          NAME: ${{ steps.pkg.outputs.name }}
          VERSION: ${{ steps.pkg.outputs.version }}
          NPM_TAG: ${{ steps.pkg.outputs.npm_tag }}
        run: |
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION already published; skipping"
            exit 0
          fi
          TARBALL="$(pnpm --filter "./$DIR" pack --json --pack-destination "$RUNNER_TEMP" \
            | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).filename")"
          npm publish "$TARBALL" --tag "$NPM_TAG" --access public --provenance
