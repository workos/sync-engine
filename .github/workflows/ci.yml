name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  engine:
    name: Engine Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Package-manager setup comes first so Socket Firewall configures the
      # registry pnpm will actually use. The pnpm version is read from the
      # `packageManager` field in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      # Socket Firewall is off until PUBLIC_SOCKET_FIREWALL_TOKEN reaches this
      # repo: with no token the action fails every run that is not a public
      # external-fork pull request. Uncomment to turn it back on.
      # - name: Setup Socket Firewall
      #   uses: workos/setup-socket-firewall@ca93dd8aa351f54f4729fe3377a9be23c631c25d
      #   with:
      #     token: ${{ secrets.PUBLIC_SOCKET_FIREWALL_TOKEN }}
      #     allow-external-fork-fallback: true

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm --filter @workos/sync-engine test

      - name: Build
        run: pnpm --filter @workos/sync-engine build

  postgres:
    name: Postgres Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Most of the suite runs on embedded PGlite; the multi-connection
      # regressions need a real server and skip themselves without this.
      TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Package-manager setup comes first so Socket Firewall configures the
      # registry pnpm will actually use. The pnpm version is read from the
      # `packageManager` field in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      # Socket Firewall is off until PUBLIC_SOCKET_FIREWALL_TOKEN reaches this
      # repo: with no token the action fails every run that is not a public
      # external-fork pull request. Uncomment to turn it back on.
      # - name: Setup Socket Firewall
      #   uses: workos/setup-socket-firewall@ca93dd8aa351f54f4729fe3377a9be23c631c25d
      #   with:
      #     token: ${{ secrets.PUBLIC_SOCKET_FIREWALL_TOKEN }}
      #     allow-external-fork-fallback: true

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm --filter @workos/sync-postgres test

      - name: Build
        run: pnpm --filter "@workos/sync-postgres..." build

      # The whole lifecycle — schema, backfill, tail, reconcile, repair —
      # against the fake API and an embedded Postgres, through the built
      # packages rather than the sources the unit tests import.
      - name: End-to-end example
        run: pnpm --filter workos-sync-postgres-example start

  mysql:
    name: MySQL Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 127.0.0.1:3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # There is no embedded MySQL, so the whole suite runs against the
      # service; without this variable the database-backed tests skip.
      TEST_MYSQL_URL: mysql://root@127.0.0.1:3306
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm --filter @workos/sync-mysql test:database

      - name: Build
        run: pnpm --filter "@workos/sync-mysql..." build
