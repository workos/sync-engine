name: Release Please

# Every package has an npm trusted publisher that names THIS file, not
# release.yml: when a publish runs inside a workflow_call, npm validates the
# calling workflow's filename. Provenance is attached automatically once the
# repo is public; nothing here changes for that.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# id-token: write and packages: write are not used by this workflow directly,
# but the caller's token permissions cap what the called release.yml may
# request — its publish job needs id-token: write for npm trusted publishing
# (OIDC) and its publish-ghcr job needs packages: write to push the image.
# Without them here, the whole run fails at startup with a workflow-file error.
permissions:
  contents: write
  pull-requests: write
  id-token: write
  packages: write

jobs:
  # Each package is its own release-please component with its own version,
  # changelog and tag (sync-engine-v1.2.3). A commit counts toward a package
  # when it touches files under that package's directory, and the
  # node-workspace plugin gives @workos/sync-postgres a patch release
  # whenever @workos/sync-engine releases, so the published pair is always
  # one that was tested together.
  release-please:
    runs-on: ubuntu-latest
    outputs:
      sync-engine--release_created: ${{ steps.release.outputs['packages/sync-engine--release_created'] }}
      sync-engine--tag_name: ${{ steps.release.outputs['packages/sync-engine--tag_name'] }}
      sync-postgres--release_created: ${{ steps.release.outputs['packages/sync-postgres--release_created'] }}
      sync-postgres--tag_name: ${{ steps.release.outputs['packages/sync-postgres--tag_name'] }}
      sync-mysql--release_created: ${{ steps.release.outputs['packages/sync-mysql--release_created'] }}
      sync-mysql--tag_name: ${{ steps.release.outputs['packages/sync-mysql--tag_name'] }}
      sync-mongodb--release_created: ${{ steps.release.outputs['packages/sync-mongodb--release_created'] }}
      sync-mongodb--tag_name: ${{ steps.release.outputs['packages/sync-mongodb--tag_name'] }}
      sync-clickhouse--release_created: ${{ steps.release.outputs['packages/sync-clickhouse--release_created'] }}
      sync-clickhouse--tag_name: ${{ steps.release.outputs['packages/sync-clickhouse--tag_name'] }}
    steps:
      # Release PRs and tags come from the SDK Automation Bot, as in workos-node.
      # Events raised with GITHUB_TOKEN start no workflow runs, so a release PR
      # opened with it would never get the checks main requires; the bot's PRs
      # get them like any other. SDK_BOT_APP_ID is an org variable and
      # SDK_BOT_PRIVATE_KEY an org secret, both already visible to this repo.
      - name: Generate token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.SDK_BOT_APP_ID }}
          private-key: ${{ secrets.SDK_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.generate-token.outputs.token }}

  publish-sync-engine:
    needs: release-please
    if: ${{ needs.release-please.outputs.sync-engine--release_created == 'true' }}
    uses: ./.github/workflows/release.yml
    with:
      tag_name: ${{ needs.release-please.outputs.sync-engine--tag_name }}
    # Called workflows receive no secrets by default.
    secrets:
      PUBLIC_SOCKET_FIREWALL_TOKEN: ${{ secrets.PUBLIC_SOCKET_FIREWALL_TOKEN }}

  # Runs after the engine so that, when both release from one merge, the
  # dependency is on npm before the package that pins it. `!cancelled()` lets
  # this run when the engine job was skipped because only the destination
  # changed.
  publish-sync-postgres:
    needs: [release-please, publish-sync-engine]
    if: >-
      ${{ !cancelled()
          && needs.publish-sync-engine.result != 'failure'
          && needs.release-please.outputs.sync-postgres--release_created == 'true' }}
    uses: ./.github/workflows/release.yml
    with:
      tag_name: ${{ needs.release-please.outputs.sync-postgres--tag_name }}
    secrets:
      PUBLIC_SOCKET_FIREWALL_TOKEN: ${{ secrets.PUBLIC_SOCKET_FIREWALL_TOKEN }}

  publish-sync-mysql:
    needs: [release-please, publish-sync-engine]
    if: >-
      ${{ !cancelled()
          && needs.publish-sync-engine.result != 'failure'
          && needs.release-please.outputs.sync-mysql--release_created == 'true' }}
    uses: ./.github/workflows/release.yml
    with:
      tag_name: ${{ needs.release-please.outputs.sync-mysql--tag_name }}
    secrets:
      PUBLIC_SOCKET_FIREWALL_TOKEN: ${{ secrets.PUBLIC_SOCKET_FIREWALL_TOKEN }}

  publish-sync-mongodb:
    needs: [release-please, publish-sync-engine]
    if: >-
      ${{ !cancelled()
          && needs.publish-sync-engine.result != 'failure'
          && needs.release-please.outputs.sync-mongodb--release_created == 'true' }}
    uses: ./.github/workflows/release.yml
    with:
      tag_name: ${{ needs.release-please.outputs.sync-mongodb--tag_name }}
    secrets:
      PUBLIC_SOCKET_FIREWALL_TOKEN: ${{ secrets.PUBLIC_SOCKET_FIREWALL_TOKEN }}

  publish-sync-clickhouse:
    needs: [release-please, publish-sync-engine]
    if: >-
      ${{ !cancelled()
          && needs.publish-sync-engine.result != 'failure'
          && needs.release-please.outputs.sync-clickhouse--release_created == 'true' }}
    uses: ./.github/workflows/release.yml
    with:
      tag_name: ${{ needs.release-please.outputs.sync-clickhouse--tag_name }}
    secrets:
      PUBLIC_SOCKET_FIREWALL_TOKEN: ${{ secrets.PUBLIC_SOCKET_FIREWALL_TOKEN }}
